name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.21.13", "1.26.5"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test -short ./...
      - run: go vet ./...
      - run: go build ./...

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - run: go test -race -short ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - run: git diff --check

  ecosystem-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kook_ecosystem_test
          POSTGRES_USER: kook
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kook -d kook_ecosystem_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.21.13"
          cache: true
      - run: go test ./internal/ecosystem -run '^TestPostgresAndRedisIntegration$' -count=1 -v
        env:
          ECOSYSTEM_TEST_DATABASE_URL: postgres://kook:integration-test-only@127.0.0.1:5432/kook_ecosystem_test?sslmode=disable
          ECOSYSTEM_TEST_REDIS_URL: redis://127.0.0.1:6379/15
